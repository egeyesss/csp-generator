id: dorm
name: Freshman Hallway
description: >
  Five freshmen live in adjacent rooms on the same hallway. Each is in a
  different major, plays a different sport, keeps a different snack stashed
  in their desk, and listens to a different genre of music.
entity_label: student
position_label: room
question_target:
  - major
  - cs
descriptors:
  name:
    subject: "{value}"
  major:
    subject: "the {value} major"
    predicate: "majors in {value}"
  sport:
    subject: "the {value} player"
    predicate: "plays {value}"
  snack:
    subject: "the {value} hoarder"
    predicate: "stashes {value}"
  music:
    subject: "the {value} fan"
    predicate: "listens to {value}"
attributes:
  name:
    - Maya
    - Jordan
    - Priya
    - Sam
    - Theo
  major:
    - cs
    - biology
    - econ
    - history
    - art
  sport:
    - soccer
    - basketball
    - tennis
    - swimming
    - climbing
  snack:
    - popcorn
    - chips
    - chocolate
    - granola
    - ramen
  music:
    - hip-hop
    - indie
    - classical
    - jazz
    - metal
