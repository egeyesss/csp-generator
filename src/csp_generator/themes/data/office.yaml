id: office
name: The Corner Office
description: >
  Five employees share a row of offices on the same floor. Each has a
  different role, drinks something different at lunch, drives a different
  car to work, and prefers a different coding language.
entity_label: employee
position_label: office
question_target:
  - role
  - ceo
descriptors:
  name:
    subject: "{value}"
  role:
    subject: "the {value}"
    predicate: "is the {value}"
  drink:
    subject: "the {value} drinker"
    predicate: "drinks {value}"
  car:
    subject: "the {value} driver"
    predicate: "drives a {value}"
  language:
    subject: "the {value} developer"
    predicate: "codes in {value}"
attributes:
  name:
    - Alice
    - Bob
    - Carla
    - Dmitri
    - Elena
  role:
    - intern
    - engineer
    - designer
    - manager
    - ceo
  drink:
    - espresso
    - matcha
    - cola
    - kombucha
    - water
  car:
    - Tesla
    - Honda
    - Ford
    - Toyota
    - Subaru
  language:
    - Python
    - Rust
    - TypeScript
    - Go
    - Java
